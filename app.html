<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alba PIP – Portfolio Intelligence Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!--
      The tab icon is the supplied artwork at public/favicon.png.

      It was an inline SVG data URI four times before this, the mark redrawn by
      hand on each attempt, and every replacement left the tail of the one
      before it loose in the head. A browser will not keep stray element content
      in <head>: it moved all four fragments to the top of the body, so every
      page in the application opened with a row of `" />` above the title.
      One line, one file, nothing left behind.
    -->
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <!--
      Paint the ground before the application loads.

      The page carries the dark ground so it is never white for the moment
      before React mounts. For anybody who has chosen the light palette that is
      the opposite problem — a black flash on every reload — so the stored
      preference is read here, ahead of the bundle, and the ground set to match.
      It has to be inline and it has to be in the head: this is the only code
      that runs before the first paint. The two colours are C.bg from each
      palette in src/lib/theme.js; nothing else in the application repeats them.
    -->
    <style>
      html, body { margin: 0; padding: 0; background: #0A0A0B; }
      html[data-look="light"], html[data-look="light"] body { background: #F7F6F2; }
    </style>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem("alba.prefs.v1") || "{}");
        if (p.theme === "light") document.documentElement.dataset.look = "light";
      } catch (e) { /* storage blocked — the dark ground stands */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
